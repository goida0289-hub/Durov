name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)
          unzip -o jdm_game_godot.zip
      - name: Prepare Godot and keystore
        run: |
          mkdir -p ~/.config/godot
          src=$(find / -type d -name "4.3.stable" -not -path "/proc/*" -not -path "/github/*" 2>/dev/null | head -n1)
          echo "found: $src"
          dst=$HOME/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$dst"
          if [ -n "$src" ]; then cp -r "$src"/. "$dst"/; fi
          if [ ! -f "$dst/android_debug.apk" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/t.zip || curl -sSL -o /tmp/t.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q /tmp/t.zip -d /tmp/t
            cp -r /tmp/t/templates/. "$dst"/
          fi
          ls "$dst" | head -n 30
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOT
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          cd jdm_game
          godot --headless --import || true
          godot --headless --export-debug "Android" ../build/android/jdm-game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jdm-game-apk
          path: build/android/*.apk
